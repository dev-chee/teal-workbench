[package]
name = "teal-bench"
description = "Teal 的 Windows 优先模态终端集成开发环境"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
teal-security = { workspace = true, features = ["sqlite"] }
clap = { workspace = true, features = ["derive"] }
crossterm.workspace = true
futures-util.workspace = true
opentelemetry.workspace = true
ratatui.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
teal-utils.workspace = true
similar.workspace = true
slotmap.workspace = true
teal-agent = { workspace = true, features = ["codex-auth"] }
teal-model = { workspace = true, features = ["codex-auth"] }
teal-compiler.workspace = true
teal-config.workspace = true
teal-host = { workspace = true, features = ["ffi"] }
teal-workbench-automation.workspace = true
teal-workbench-core = { workspace = true, features = ["syntax"] }
teal-lsp-client.workspace = true
teal-dap.workspace = true
teal-workbench-services = { workspace = true, features = ["tools", "observability"] }
teal-knowledge.workspace = true
teal-web.workspace = true
teal = { workspace = true, features = ["ffi"] }
teal-vm.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true

[dev-dependencies]
tracing-opentelemetry.workspace = true
opentelemetry-proto.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
prost.workspace = true

[lints]
workspace = true

[[bin]]
name = "teal-bench"
path = "src/bin/teal-bench.rs"

[[bin]]
name = "teal-config"
path = "src/bin/teal-config.rs"

[[bin]]
name = "teal-perm"
path = "src/bin/teal-perm.rs"
