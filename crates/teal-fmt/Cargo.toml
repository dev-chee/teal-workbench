[package]
name = "teal-fmt"
description = "Teal 源码格式化库"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
publish = false
autobins = false

[lib]
name = "teal_fmt"
path = "src/lib.rs"

[[bin]]
name = "teal-fmt"
path = "src/bin/teal-fmt.rs"

[dependencies]
clap = { workspace = true, features = ["string"] }
miette = { workspace = true, features = ["fancy"] }
teal-config.workspace = true
teal-compiler.workspace = true
teal-security = { workspace = true, features = ["sqlite"] }
teal-workbench-services = { workspace = true, features = ["observability"] }
tempfile.workspace = true
thiserror.workspace = true

[lints]
workspace = true
