[package]
name = "teal-workbench-automation"
description = "Teal 工作台中受能力控制的 Teal 配置、自动化与文法宿主"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
autobins = false

[dependencies]
clap = { workspace = true, features = ["derive"] }
teal-security = { workspace = true, default-features = false, features = ["sqlite"] }
opentelemetry.workspace = true
teal-workbench-core = { workspace = true, features = ["syntax"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
teal-utils.workspace = true
teal = { workspace = true }
thiserror.workspace = true
tempfile.workspace = true
tracing.workspace = true
tokio.workspace = true
toml.workspace = true
teal-agent.workspace = true
teal-model.workspace = true
teal-config.workspace = true
teal-knowledge.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tokio.workspace = true
teal-model.workspace = true

[lints]
workspace = true

[[bin]]
name = "teal-knowledge"
path = "src/bin/teal-knowledge.rs"
